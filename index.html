<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>열흘책방 물결상점</title>
  <meta
    name="description"
    content="작은 3D 책방 세계를 탐험하며 열흘책방 물결상점의 링크와 정보를 만나는 인터랙티브 웹사이트"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Nanum+Pen+Script&family=Pretendard:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-noise"></div>
  <div class="page-glow glow-left"></div>
  <div class="page-glow glow-right"></div>

  <!-- intro -->
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-paper">
      <div class="intro-grid"></div>

      <div class="intro-content">
        <span class="intro-kicker">manuscript opening</span>

        <div class="writing-stage" id="writingStage">
          <div class="writing-mask" id="writingMask">
            <span class="writing-text" id="writingText">열흘책방 물결상점</span>
          </div>
          <span class="pencil-cursor" id="pencilCursor"></span>
        </div>

        <p class="intro-sub" id="introSub">
          작은 책방 세계가 천천히 열립니다
        </p>
      </div>

      <div class="wave-wash" id="waveWash"></div>
    </div>
  </div>

  <main class="scene-page">
    <canvas id="world"></canvas>

    <div class="ui-layer">
      <section class="title-panel">
        <span class="eyebrow">mini 3d bookstore world</span>

        <div class="manuscript-box">
          <div class="paper-grid" aria-hidden="true"></div>
          <h1>열흘책방<br />물결상점</h1>
        </div>

        <p class="scene-hint">오브젝트를 클릭하거나 드래그해 둘러보세요</p>
      </section>

      <aside class="info-panel" id="infoPanel">
        <span class="info-kicker" id="infoKicker">welcome</span>
        <h2 id="infoTitle">작은 책방 세계를 둘러보세요</h2>
        <p id="infoText">
          책, 카드, 메모, 입간판, 시계 카드를 클릭하면 필요한 정보로 연결됩니다.
        </p>
      </aside>

      <div class="hover-tag" id="hoverTag"></div>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
